<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなのクイズ大会</title>
<meta name="description" content="ルーム番号を入力するだけで参加できるオンライン対戦クイズ。個人戦・チーム戦、早押し、タイピングに対応。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one centered stage column, like a game-show screen; answer tiles are the only loud color. */
:root{
  --bg:#FFF4CC; --surface:#FFFDF4; --ink:#1E1B2E; --muted:#6C6680; --line:#EADBA4;
  --hi:#FFC21A; --on-hi:#1E1B2E; --hi-shadow:#C48C00;
  --good:#16935F; --bad:#D23A3F;
  --a1:#E0464B; --a2:#2D72E8; --a3:#F2A21B; --a4:#1E9B67; --on-a:#FFFFFF; --on-a3:#2A1C00;
  --silver:#C9C4D6; --bronze:#E3A86B;
  --team-red:#D9373D; --team-blue:#2563D6;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --dot:"DotGothic16","Hiragino Sans",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15131D; --surface:#211E2D; --ink:#FFF4CC; --muted:#A39CB8; --line:#363149; --good:#3CCB8B; --bad:#FF6B6F; --silver:#8E88A3; --bronze:#B9804A; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.15rem}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--hi);color:var(--on-hi);font-size:1.2rem;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--hi)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:.8rem;color:var(--muted);background:var(--surface);max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.off .dot{background:var(--bad)}
.pill.host{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
.hbtn{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:4px 12px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-size:.82rem;font-weight:700;line-height:1;white-space:nowrap}
.hbtn:active{transform:translateY(1px)}
.hbtn.muted{border-color:var(--line);color:var(--muted)}
.hbtn.leave{border-color:var(--bad);color:var(--bad)}
.hbtn.leave.sure{background:var(--bad);color:var(--surface)}

.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:700;background:var(--ink);color:var(--bg);font-size:1rem;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.hi{background:var(--hi);color:var(--on-hi);box-shadow:0 4px 0 var(--hi-shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:7px 14px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.center{text-align:center}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.88rem}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-weight:700;min-height:1.6em}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 0 8px}
.hero h1{font-size:clamp(2rem,8vw,3.2rem)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.home-grid{grid-template-columns:1fr}}
.home-grid .panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.lbl{font-size:.82rem;color:var(--muted);letter-spacing:.06em;font-weight:700}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.1rem}
input.code{font-family:var(--dot);font-size:1.8rem;letter-spacing:.3em;text-align:center}

/* lobby */
.marquee{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:12px 0}
.marquee h1{font-size:clamp(1.6rem,6vw,2.6rem)}
.code-card{display:flex;flex-direction:column;align-items:center;gap:4px}
.big-code{font-family:var(--dot);font-size:clamp(3.4rem,16vw,6rem);line-height:1;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.share{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:100%}
.share code{font-size:.85rem;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:pop .25s ease-out}
.chip.me{border-color:var(--hi);background:var(--hi);color:var(--on-hi)}
.chip.off{opacity:.45}
.chip.ready{border-color:var(--good);color:var(--good)}
.chip.ready.me{background:var(--good);color:var(--surface);border-color:var(--good)}
.chip .crown{font-size:.75rem;margin-left:4px}
.chip.bot{border-style:dashed;display:inline-flex;align-items:center;gap:6px}
.npc{display:inline-block;font-family:var(--dot);font-size:.72rem;font-weight:400;padding:0 6px;border-radius:6px;background:var(--line);color:var(--ink);letter-spacing:.04em;vertical-align:middle}
.chip .x{border:0;background:none;padding:0 2px;font-size:1rem;line-height:1;color:var(--muted)}
.npc-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}

.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.genre{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.genre b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.genre small{color:var(--muted);font-size:.8rem}
.genre[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--on-hi)}
.genre[aria-pressed="true"] small{color:var(--on-hi);opacity:.75}
.genre:disabled{cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-family:var(--dot);font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{cursor:default}
.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.setting-row{grid-template-columns:1fr}}
.setting-row>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:.8rem;font-weight:700}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qno{font-family:var(--dot);font-size:1.1rem;letter-spacing:.06em}
.timer{font-family:var(--dot);font-size:2.6rem;line-height:1;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi);transition:width .25s linear}
.qtext{font-family:var(--display);font-size:clamp(1.35rem,4.6vw,2.1rem);line-height:1.45;text-wrap:balance;padding:8px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{position:relative;display:flex;align-items:center;gap:12px;min-height:96px;border:0;border-radius:18px;padding:14px 16px;text-align:left;font-weight:700;font-size:1.08rem;color:var(--on-a);box-shadow:0 5px 0 rgba(0,0,0,.22);min-width:0}
.ans .t{min-width:0;overflow-wrap:anywhere}
.ans .L{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.25);font-family:var(--dot);font-size:1.3rem}
.ans.c0{background:var(--a1)} .ans.c1{background:var(--a2)} .ans.c2{background:var(--a3);color:var(--on-a3)} .ans.c3{background:var(--a4)}
.ans.c2 .L{background:rgba(0,0,0,.12)}
button.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
button.ans:disabled{cursor:default}
.ans.dim{opacity:.28}
.ans.picked{outline:4px solid var(--ink);outline-offset:3px}
.ans.right::after{content:"正解";position:absolute;top:-10px;right:12px;background:var(--ink);color:var(--bg);font-size:.75rem;padding:2px 10px;border-radius:99px}
.meter{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-family:var(--dot);font-size:1.3rem}

/* juice */
.flash{position:fixed;inset:0;pointer-events:none;z-index:28;animation:flash .6s ease-out forwards}
.flash.ok{background:radial-gradient(circle at 50% 35%,rgba(255,226,120,.55),rgba(22,147,95,.18) 60%,transparent 80%)}
.flash.ng{background:radial-gradient(circle at 50% 35%,rgba(210,58,63,.28),transparent 70%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
#stage.shake{animation:shakeX .42s ease-in-out}
@keyframes shakeX{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.verdict.ok{animation:verdictpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes verdictpop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.combo{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a3));color:#fff;font-weight:700;animation:combopop .5s cubic-bezier(.2,1.6,.4,1) .25s both}
.combo b{font-family:var(--dot);font-weight:400}
@keyframes combopop{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.qhead .row{min-width:0}
.tag,.streak{flex:none;white-space:nowrap}
.streak{display:inline-block;padding:2px 10px;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a3));color:#fff;font-size:.8rem;font-weight:700}
.timer.pulse{animation:tpulse .35s ease-out}
@keyframes tpulse{0%{transform:scale(1.35)}100%{transform:none}}
.rank .mv{margin-left:6px;font-family:var(--dot);font-size:.85rem}
.rank .mv.up{color:var(--good)} .rank .mv.down{color:var(--bad)}
.rank li.rise{animation:rise .5s ease-out}
@keyframes rise{from{transform:translateY(10px);background:var(--hi)}to{transform:none}}
.rank .fire{margin-left:6px;padding:0 6px;border-radius:6px;background:var(--a1);color:#fff;font-size:.7rem;vertical-align:middle}
button.ans:active:not(:disabled){transform:translateY(3px) scale(.97)}
.reacts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.react{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.react.hit{animation:reacthit .3s ease-out}
@keyframes reacthit{50%{transform:scale(1.18)}}
.bubble{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:27;display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:16px;background:var(--surface);border:2px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15);pointer-events:none;animation:floatup 2.5s ease-out forwards;max-width:60vw}
.bubble small{font-size:.7rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.bubble.red{border-color:var(--team-red)} .bubble.blue{border-color:var(--team-blue)}
.bubble.mine{background:var(--hi);color:var(--on-hi)}
@keyframes floatup{0%{transform:translateY(20px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.05);opacity:1}100%{transform:translateY(-55vh) scale(1);opacity:0}}

/* avatars & social */
.av{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;font-size:14px;line-height:1;margin-right:6px;vertical-align:middle;background:var(--avc)}
.av.big{width:44px;height:44px;font-size:26px;margin:0}
.av.blank{background:var(--line);color:var(--muted);font-family:var(--display);font-size:20px}
.c0{--avc:#FAD4D2} .c1{--avc:#D3E2FB} .c2{--avc:#FDE7BF} .c3{--avc:#CDEEDC} .c4{--avc:#E3D7F6} .c5{--avc:#F9D6E8} .c6{--avc:#CDEDF1} .c7{--avc:#E4E1EA}
@media (prefers-color-scheme: dark){ .c0{--avc:#5A2E33} .c1{--avc:#25395E} .c2{--avc:#5A4420} .c3{--avc:#1F4A35} .c4{--avc:#3E3060} .c5{--avc:#5A2D46} .c6{--avc:#1F4B52} .c7{--avc:#3A3746} }
.chip{display:inline-flex;align-items:center;gap:2px}
.chip .av{margin-right:4px;width:22px;height:22px;font-size:13px}
.chip .cn{overflow:hidden;text-overflow:ellipsis}
.watchers{display:flex;flex-direction:column;gap:6px}
.watchers .chip{opacity:.75}
.mechip .av{width:22px;height:22px;font-size:13px;margin-right:2px}
.mechip .watch{flex:none;font-size:.65rem;padding:0 5px;border-radius:5px;background:var(--line);color:var(--ink)}
.namerow{display:flex;gap:8px;align-items:center}
.namerow input{flex:1;min-width:0}
.avbtn{flex:none;border:2px dashed var(--line);background:var(--surface);border-radius:50%;padding:4px;line-height:0}
.avbtn[aria-expanded="true"]{border-color:var(--ink);border-style:solid}
.picker{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.pick-av{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.pick-av button{border:2px solid transparent;background:none;border-radius:10px;font-size:22px;line-height:1;padding:4px 0}
.pick-av button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.pick-col{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.pick-col button{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--line);background:var(--avc)}
.pick-col button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.selfrow{gap:8px}
.selfrow .btn .av{margin-right:2px}
.podium .pod{gap:4px}
.bubble small{display:flex;align-items:center;gap:2px}
.bubble .av{width:18px;height:18px;font-size:11px;margin-right:2px}
#chatbtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:16;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#chatbtn .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.chatin{position:relative;flex:none;width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.chatin .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}
#chatpeek{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:16;max-width:min(320px,calc(100% - 32px));display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:.88rem;animation:fadeup .3s ease-out}
#chatpeek span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chatsheet{position:fixed;left:0;right:0;bottom:0;z-index:40;height:min(62vh,520px);display:flex;flex-direction:column;background:var(--surface);border-top:2px solid var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:sheetup .25s ease-out}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ch-head{display:flex;align-items:center;justify-content:space-between;max-width:860px;width:100%;margin:0 auto}
.ch-head h2{font-size:1.05rem}
.ch-list{list-style:none;margin:8px auto;padding:0;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-width:860px;width:100%}
.ch-list li{display:flex;align-items:flex-start;gap:4px;min-width:0}
.ch-list li div{min-width:0}
.ch-list small{color:var(--muted);font-size:.72rem}
.ch-list p{margin:0;padding:6px 10px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.ch-list li.mine{flex-direction:row-reverse}
.ch-list li.mine div{text-align:right}
.ch-list li.mine p{background:var(--hi);color:var(--on-hi)}
.ch-list li.empty{color:var(--muted);justify-content:center}
.ch-form{display:flex;gap:8px;max-width:860px;width:100%;margin:0 auto}
.ch-form input{flex:1;min-width:0;font-size:1rem;padding:10px 12px}

/* hidden scores & final */
.secret{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);text-align:center}
.secret b{font-family:var(--display);font-weight:400;font-size:1.8rem;letter-spacing:.2em}
.secret span{color:var(--muted);font-size:.9rem}
.stretch{margin:0;padding:8px 12px;border-radius:12px;background:var(--ink);color:var(--hi);text-align:center;font-weight:700;animation:fadeup .4s ease-out}
.pod .blk{transition:filter .3s}
.pod:not(.shown) .blk{filter:grayscale(1) brightness(.85)}
.pod:not(.shown) .nm{color:var(--muted)}
.pod.shown{animation:podpop .45s ease-out}
@keyframes podpop{0%{transform:translateY(12px) scale(.9);opacity:.3}60%{transform:translateY(-4px) scale(1.05);opacity:1}100%{transform:none}}
.drum{margin:0;text-align:center;font-family:var(--display);font-size:clamp(1.6rem,7vw,2.4rem);animation:drum .5s ease-in-out infinite alternate}
@keyframes drum{from{transform:scale(1)}to{transform:scale(1.08)}}
.tbars{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end;padding:0 8%}
.tcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.tcol .num{font-family:var(--dot);font-size:clamp(1.8rem,8vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.tcol .track{width:100%;height:240px;border-radius:14px 14px 6px 6px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:flex-end;overflow:hidden}

.tbars.hold .track{animation:wobble .18s linear infinite}

.tmsg{min-height:1.4em}
.tmsg.shake{animation:wobble .2s linear infinite}

/* updates */
.updates{gap:10px}

.typed li.me{box-shadow:inset 4px 0 0 var(--hi)}
.typed .mk{font-weight:700;text-align:center}
.typed li.ok .mk{color:var(--good)} .typed li.ng .mk{color:var(--bad)}
.typed .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typed .tx{overflow-wrap:anywhere}
.typed .sec{font-family:var(--dot);color:var(--muted);font-size:.9rem}
.typed li.empty{display:block;text-align:center}

/* reveal */
.verdict{font-family:var(--display);font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.1}

.dcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.dcol b{font-family:var(--dot);font-size:1.1rem;font-weight:400}

.dcol.c0 i{background:var(--a1)} .dcol.c1 i{background:var(--a2)} .dcol.c2 i{background:var(--a3)} .dcol.c3 i{background:var(--a4)}

.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.rank li.me{border-color:var(--hi);box-shadow:inset 4px 0 0 var(--hi)}
.rank .pos{font-family:var(--dot);font-size:1.1rem;text-align:center}
.rank .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .gain{font-family:var(--dot);color:var(--good);font-size:.95rem}
.rank .sc{font-family:var(--dot);font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right;min-width:4ch}

/* podium */

/* vote */
.vote-sec{display:flex;flex-direction:column;gap:8px}

.vote-opts.two{grid-template-columns:1fr 1fr}
.vote-opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.vote-opts.three .vopt{align-items:center;padding:12px 6px}

.vote-opts.small{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}

/* slots */

.reveal-in{animation:fadeup .4s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* teams */

.team .tg{font-family:var(--dot);font-size:.95rem;opacity:.9}
.team .tm{font-size:.85rem;opacity:.95;overflow-wrap:anywhere}
.team.lead{box-shadow:0 0 0 4px var(--hi)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tdot.red{background:var(--team-red)} .tdot.blue{background:var(--team-blue)}
.myteam{display:inline-block;padding:2px 10px;border-radius:99px;color:var(--on-a);font-size:.8rem;font-weight:700}
.myteam.red{background:var(--team-red)} .myteam.blue{background:var(--team-blue)}
.buzzline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:.9rem}
.miss{padding:2px 10px;border-radius:99px;border:1.5px solid var(--bad);color:var(--bad);font-weight:700}
.banner{font-family:var(--display);font-size:clamp(1.4rem,6vw,2rem);text-align:center}

#netbar{position:fixed;left:0;right:0;top:0;z-index:25;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--hi);text-align:center;font-size:.9rem;font-weight:700}
/* ===== layout cleanup ===== */
.top{flex-wrap:nowrap}
.brand{min-width:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){ body.in-room .brand span:last-child{display:none} }
.who{flex-wrap:nowrap;gap:6px;min-width:0}
.mechip{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:11em;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:.85rem}
.mechip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mechip .crown{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--hi);color:var(--on-hi);font-size:.65rem}
.mechip.t-red{background:var(--team-red);border-color:var(--team-red);color:#fff}
.mechip.t-blue{background:var(--team-blue);border-color:var(--team-blue);color:#fff}
.mechip.off{opacity:.5}
.hbtn.icon{width:36px;padding:0;justify-content:center}
.hbtn{min-height:34px}
.lbl{display:block}
.hint{margin:0;color:var(--muted);font-size:.85rem}
.title{font-size:clamp(1.3rem,5vw,1.7rem)}
.btn.block{width:100%}
.btn.grow{flex:1}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h h2{font-size:1.05rem}
.card .chips{justify-content:flex-start}
.setline{margin:0;display:flex;gap:6px;font-size:1.05rem}
.setline span{color:var(--muted)}
/* home */
.hero{padding:14px 0 0}
.hero h1{font-size:clamp(1.9rem,8vw,3rem)}
.home-card{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px;margin:0}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0}
.joinrow .btn{flex:none;padding-inline:26px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}

.home-card .err:empty{display:none}

.updates h2{font-size:.95rem;color:var(--muted);font-family:var(--body);font-weight:700}
/* lobby */
.code-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.npc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;border-top:1.5px dashed var(--line)}

.waiting{margin:0;flex:1;text-align:center;color:var(--muted);font-weight:700}
/* action bar fixed at the bottom */
.bar-spacer{height:84px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1.5px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.actionbar .btn{min-height:48px}
.readyinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dotnames{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dotname{flex:none;font-size:.78rem;padding:1px 8px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.dotname.ready{border-color:var(--good);color:var(--good);font-weight:700}

.nextbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.nextbar i{display:block;height:100%;width:100%;background:var(--ink);transition:width .2s linear}
/* vote */
.vote-opts.genre{grid-template-columns:repeat(3,minmax(0,1fr))}
.vote-opts.genre .vopt{align-items:center;padding:12px 6px}
.vote-opts.genre .vopt b{font-size:.95rem;text-align:center}
@media (max-width:360px){ .vote-opts.genre{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* reveal */
.result{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);text-align:center}
.result.ok{border-color:var(--good)}
.result.ng{border-color:var(--line)}
.verdict.none{color:var(--muted)}
.qtext.small{font-size:1.05rem;padding:0;line-height:1.5}

.arow{display:grid;grid-template-columns:28px minmax(0,1fr) auto 64px 2.6em;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);opacity:.6}
.arow.right{opacity:1;border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}

.arow .L{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--on-a);font-family:var(--dot)}
.arow.c0 .L{background:var(--a1)} .arow.c1 .L{background:var(--a2)} .arow.c2 .L{background:var(--a3);color:var(--on-a3)} .arow.c3 .L{background:var(--a4)}
.arow .t{font-weight:700;overflow-wrap:anywhere}

.abar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}

.card.more{gap:0}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">Q</span><span>みんなのクイズ大会</span></div>
    <div class="who" id="who"></div>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<div id="toast" hidden></div>
<div id="netbar" role="status" hidden></div>
<button type="button" id="chatbtn" data-act="chatOpen" aria-label="チャットを開く" hidden>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  <span class="badge" id="chatbadge" hidden></span>
</button>
<div id="chatpeek" hidden></div>
<section id="chatsheet" aria-label="チャット" hidden>
  <div class="ch-head"><h2>チャット</h2><button type="button" class="hbtn" data-act="chatClose">閉じる</button></div>
  <ol class="ch-list" id="chatlist"></ol>
  <form class="ch-form" id="chatform" autocomplete="off">
    <input type="text" id="chatinput" maxlength="60" placeholder="メッセージ（60文字まで）" aria-label="メッセージ">
    <button class="btn hi" type="submit">送信</button>
  </form>
</section>

<script>
(function(){
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = ['A','B','C','D'];
const TEAM_NAME = {red:'赤チーム', blue:'青チーム'};
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }

let session = null;      // {code, token}
try{ session = JSON.parse(store('quiz.session') || 'null'); }catch(e){ session = null; }
let state = null;        // latest state from the server
let es = null;           // EventSource
let online = false;
let deadline = 0;        // local ms when the current timer (vote / decided / question) ends
let lastKey = null;
let pendingAnswer = null;
let pendingText = null;     // タイピングで送った答え（サーバーの返事を待つあいだ）
let typingDraft = '';       // 入力中の答え
let composing = false;      // 日本語入力の変換中
let homeError = '';
let reconnecting = false;
let botLevel = store('quiz.botLevel') || 'normal';

/* ---------- server ---------- */
async function api(action, body){
  try{
    const r = await fetch('/api/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({}, session || {}, body || {}))});
    return await r.json();
  }catch(e){ return {ok:false, net:true, error:'サーバーに接続できません。通信状態を確認してください。'}; }
}
async function post(action, body){
  return fetch('/api/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then((x) => x.json()).catch(() => ({ok:false, error:'サーバーに接続できません。'}));
}
// ---- 効果音（ファイルを使わず、その場で音を作る） ----
const sfx = (() => {
  let ctx = null;
  let muted = store('quiz.mute') === '1';
  function ac(){
    if(muted) return null;
    try{
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
    }catch(e){ return null; }
    return ctx;
  }
  function tone(freq, at, dur, type, vol, slideTo){
    const c = ac(); if(!c) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();

    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const c = ac(); if(!c) return;

    src.start(c.currentTime + at);
  }
  return {
    unlock(){ ac(); },
    get muted(){ return muted; },
    toggle(){ muted = !muted; store('quiz.mute', muted ? '1' : '0'); if(!muted){ ac(); this.tap(); } },
    tap(){ tone(620, 0, 0.07, 'triangle', 0.14); },
    send(){ tone(520, 0, 0.06, 'triangle', 0.12); tone(780, 0.05, 0.08, 'triangle', 0.12); },
    correct(){ tone(1046.5, 0, 0.14, 'sine', 0.2); tone(1568, 0.12, 0.38, 'sine', 0.2); },        // ピンポーン
    wrong(){ tone(196, 0, 0.42, 'square', 0.07); tone(185, 0, 0.42, 'sawtooth', 0.05); },          // ブブー
    combo(n){ const base = 660; for(let i = 0; i < Math.min(n, 6); i++) tone(base * Math.pow(1.1225, i * 2), 0.32 + i * 0.07, 0.12, 'triangle', 0.12); },
    tick(){ tone(1320, 0, 0.05, 'square', 0.05); },
    question(){ tone(880, 0, 0.08, 'sine', 0.08, 1320); },
    buzz(){ tone(440, 0, 0.2, 'square', 0.07); tone(660, 0.08, 0.2, 'square', 0.05); },
    slot(){ tone(700 + Math.random() * 500, 0, 0.025, 'square', 0.025); },
    stop(){ tone(1175, 0, 0.18, 'triangle', 0.16); tone(1760, 0.06, 0.2, 'sine', 0.08); },
    drum(){ for(let i = 0; i < 22; i++) noise(i * 0.09, 0.08, 0.05 + i * 0.006); },
    fanfare(){ [523, 659, 784, 1046.5].forEach((f, i) => tone(f, i * 0.12, 0.22, 'triangle', 0.16)); tone(1046.5, 0.5, 0.6, 'sine', 0.14); tone(1318.5, 0.5, 0.6, 'sine', 0.1); },
    pop(){ tone(1200, 0, 0.07, 'sine', 0.07, 1700); },

})();

let revealFxKey = null, buzzFxKey = null, missFxKey = null, questionFxKey = null;
function runFx(prev, cur){
  if(!cur || !cur.question) return;
  const key = cur.code + ':' + cur.question.index + ':' + (cur.config ? cur.config.genre : '');
  if(cur.phase === 'question' && questionFxKey !== key){ questionFxKey = key; sfx.question(); }
  if(cur.phase === 'question' && cur.buzz){
    if(cur.buzz.winnerName && buzzFxKey !== key && cur.buzz.winnerName !== cur.me.name){ buzzFxKey = key; sfx.buzz(); }
    if(cur.buzz.myMissed && missFxKey !== key){ missFxKey = key; sfx.wrong(); shake(); vibrate(90); }
  }
  if(cur.phase === 'reveal' && cur.reveal && revealFxKey !== key){
    revealFxKey = key;
    const rv = cur.reveal;
    if(rv.myCorrect && rv.myGain){
      sfx.correct(); flash('ok'); confetti(26); vibrate([25, 40, 25]);
      if(rv.myStreak >= 2) sfx.combo(rv.myStreak);
    } else if(cur.myAnswer != null && !(cur.buzz && cur.buzz.myMissed)){
      sfx.wrong(); flash('ng'); shake(); vibrate(90);
    }
  }
}

function countUp(){
  const el = document.getElementById('gainpts'); if(!el) return;

  if(countedKey === key || reducedMotion){ el.textContent = '+' + to; return; }
  countedKey = key;
  const t0 = performance.now(), dur = 650;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
    const cur = document.getElementById('gainpts');
    if(cur) cur.textContent = '+' + v;
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}

const APP_VERSION = '__APP_VERSION__';   // サーバーが画面を送るときに書きかえる
let lastSnap = null;                     // サーバーから預かっている、ルームの保存データ
let restarting = false;                  // サーバー更新中の合図を受けとった
let offlineSince = Date.now();
function loadSnap(){
  try{ const o = JSON.parse(sessionStorage.getItem('quiz.snap') || 'null'); if(o && session && o.code === session.code) lastSnap = o.snap; }catch(e){}
}
function saveSnap(snap){
  if(!snap || !session) return;
  lastSnap = snap;
  try{ sessionStorage.setItem('quiz.snap', JSON.stringify({code: session.code, snap})); }catch(e){}
}
function setOnline(on){
  if(on === online) return;
  online = on;
  offlineSince = on ? 0 : Date.now();
  if(on) restarting = false;
  renderHeader(); renderNetbar();
}
function renderNetbar(){
  const bar = $('#netbar'); if(!bar) return;
  const show = !!session && !online && (restarting || Date.now() - offlineSince > 1500);
  bar.hidden = !show;
  if(show) bar.textContent = restarting ? 'サーバーを更新しています。まもなく再開します…' : '接続が切れました。再接続しています…';
}
// 新しい版が公開されていたら、入力途中の答えを残して読みこみ直す
function checkVersion(v){
  if(!v || APP_VERSION.startsWith('__') || v === APP_VERSION) return false;
  try{
    if(sessionStorage.getItem('quiz.reloadedFor') === v) return false; // 読みこみ直しをくり返さない
    sessionStorage.setItem('quiz.reloadedFor', v);
    sessionStorage.setItem('quiz.draft', JSON.stringify({key: lastKey, text: typingDraft}));
  }catch(e){ return false; }
  location.reload();
  return true;
}
function connect(){
  if(es) es.close();
  es = new EventSource('/events?code=' + encodeURIComponent(session.code) + '&token=' + encodeURIComponent(session.token));
  es.addEventListener('state', (ev) => {
    let next;
    try{ next = JSON.parse(ev.data); }catch(e){ return; }
    setOnline(true);
    if(next.snap) saveSnap(next.snap);
    if(checkVersion(next.version)) return;
    const prev = state;
    state = next;
    onState();
    runFx(prev, state);
  });
  es.addEventListener('react', (ev) => { try{ showReaction(JSON.parse(ev.data)); }catch(e){} });
  es.addEventListener('restart', (ev) => {
    try{ const d = JSON.parse(ev.data); if(d.snap) saveSnap(d.snap); }catch(e){}
    restarting = true; setOnline(false); renderNetbar();
  });
  es.onerror = () => { setOnline(false); resume(); };
}
// つなぎ直す。ルームが消えていたら（サーバーの更新など）預かっていたデータで再開する
async function resume(){
  if(reconnecting || !session) return;
  reconnecting = true;
  let r = await api('join');
  if(!r.ok && !r.net && lastSnap) r = await api('restore', {snap: lastSnap});
  reconnecting = false;
  if(r.net){ setTimeout(() => { if(session && !online) resume(); }, 2500); return; }
  if(!r.ok){
    if(es) es.close(); es = null;
    leaveLocal(r.error && r.error !== 'ルームが見つかりません。番号を確認してください。' ? r.error : 'ルームが終了しました。新しいルームを作成するか、別のルームに参加してください。');
    return;
  }
  if(checkVersion(r.version)) return;
  if(!es || es.readyState === EventSource.CLOSED) setTimeout(() => { if(session) connect(); }, 300);
}
function saveSession(s){ session = s; store('quiz.session', s ? JSON.stringify(s) : null); }
function leaveLocal(msg){

  saveSession(null); state = null; homeError = msg || '';
  lastSnap = null; try{ sessionStorage.removeItem('quiz.snap'); }catch(e){}

/* ---------- state ---------- */
function timerSource(){
  if(!state) return null;
  if(state.phase === 'decided' && state.decided) return {ms: state.decided.remainingMs, key: 'decided'};
  if(state.phase === 'question' && state.question) return {ms: state.question.remainingMs, key: 'q' + state.question.index};
  if(state.phase === 'reveal' && state.reveal) return {ms: state.reveal.nextInMs, key: 'r' + state.question.index};
  return null;
}
function onState(){
  const t = timerSource();
  if(t){
    const fresh = Date.now() + t.ms;
    if(t.key !== lastKey || Math.abs(fresh - deadline) > 700) deadline = fresh;
    if(t.key !== lastKey){ pendingAnswer = null; pendingText = null; typingDraft = ''; }
    lastKey = t.key;
  } else lastKey = state.phase;
  render();
}

const isHost = () => !!(state && state.me && state.me.isHost);
const remainingMs = () => Math.max(0, deadline - Date.now());

const isTeam = () => !!(state && state.config && state.config.format === 'team' && state.teams);

    const name = getName(); if(!name) return;
    const code = codeEl.value.replace(/\D/g, '');
    if(code.length < 4){ err.textContent = 'ルーム番号（4桁）を入力してください。'; codeEl.focus(); return; }
    const r = await post('join', {code, name, avatar: myAvatar, color: myColor, spectator: $('#watch').checked});
    if(!r.ok){ err.textContent = r.error || '参加できませんでした。'; return; }
    homeError = ''; pickerOpen = false; saveSession({code:r.code, token:r.token}); connect(); render();
  });
  $('#create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = getName(); if(!name) return;
    const r = await post('create', {name, avatar: myAvatar, color: myColor});
    if(!r.ok){ err.textContent = r.error || 'ルームを作成できませんでした。'; return; }
    homeError = ''; pickerOpen = false; saveSession({code:r.code, token:r.token}); connect(); render();
  });
  if(new URLSearchParams(location.search).get('room') && !nameEl.value) nameEl.focus();
}

/* decided */
// スロットが止まる時間（決定画面が出てからのミリ秒）
const SLOT_KEYS = ['format', 'mode', 'answer', 'genre', 'difficulty'];
const SLOT_STOPS = [1600, 2700, 3800, 4900, 6000];
const AFTER_SLOTS = 6700;   // 問題数・制限時間とモードの説明を出す
const TEAM_SHOW = 7900;     // チーム発表を出す
let decidedStart = 0, decidedKey = null, slotRAF = 0;
const reducedMotion = (() => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();
function decidedElapsed(){ return reducedMotion ? 99999 : Date.now() - decidedStart; }

function decidedHTML(){
  const d = state.decided, c = state.config, sec = Math.ceil(remainingMs() / 1000);
  if(decidedKey !== state.code + c.genre + c.format + c.mode + c.difficulty + c.answer || !decidedStart){
    decidedKey = state.code + c.genre + c.format + c.mode + c.difficulty + c.answer;
    decidedStart = Date.now() - (d.elapsedMs || 0);
  }
  const votes = (k, id) => (d.tally[k] || {})[id] || 0;
  const reels = [
    {k:'format', label:'形式', result:c.formatName, n:votes('format', c.format)},
    {k:'mode', label:'モード', result:c.modeName, n:votes('mode', c.mode)},
    {k:'answer', label:'回答方式', result:c.answerName, n:votes('answer', c.answer)},
    {k:'genre', label:'ジャンル', result:c.genreName, n:votes('genre', c.genre)},
    {k:'difficulty', label:'難易度', result:c.difficultyName, n:votes('difficulty', c.difficulty)},
  ];
  const el = decidedElapsed();
  const reelHTML = reels.map((r, i) => {
    const stopped = el >= SLOT_STOPS[i];
    return `<div class="slot${stopped ? ' stopped' : ''}" id="slot-${i}">
      <small>${r.label}</small>
      <div class="window"><b class="reel" id="reel-${i}">${esc(stopped ? r.result : spinningName(i, el))}</b></div>
      <small class="votes" id="votes-${i}">${stopped ? r.n + '票' : '…'}</small>
    </div>`;
  }).join('');
  const after = el >= AFTER_SLOTS, teams = el >= TEAM_SHOW;
  return `<div class="stack">
    <div class="marquee" style="padding-bottom:0"><h1 id="dec-title">${el >= SLOT_STOPS[SLOT_STOPS.length - 1] ? 'ルール決定！' : 'ルール発表…'}</h1></div>
    <div class="slots">${reelHTML}</div>
    <div class="stack reveal-in" id="dec-after" ${after ? '' : 'hidden'}>
      <div class="rules">
        <div class="rule"><small>問題数</small><b>${c.count}問</b><small>ルーム主が決定</small></div>
        <div class="rule"><small>制限時間</small><b>${c.time}秒</b><small>ルーム主が決定</small></div>
      </div>
      ${c.leveled ? '' : `<p class="center muted">${esc(c.genreName)}は難易度に関係なく出題されます。</p>`}
      ${c.answer === 'typing' ? '<p class="center muted">タイピング：答えを入力して送信します。ひらがな・カタカナ・漢字のどれでも正解になります。</p>' : c.answer === 'mixed' ? '<p class="center muted">混合：4択とタイピングの問題が混ざって出題されます。</p>' : ''}
      ${d.forcedSolo ? '<p class="center muted">チーム戦は2人以上で行うため、今回は個人戦になりました。</p>' : ''}
      ${isBuzz() ? '<p class="center muted">早押し：最初に正解した人だけが1000点を獲得。誤答（お手つき）すると、その問題には回答できません。</p>' : '<p class="center muted">全員が回答できます。早く正解するほど高得点です。</p>'}
    </div>
    ${isTeam() ? `<div class="stack reveal-in" id="dec-teams" ${teams ? '' : 'hidden'}><h3 class="center">チーム発表</h3>${teamsHTML()}<p class="center muted" style="font-size:.85rem">チームの得点は、メンバーの平均点です。</p></div>` : ''}
    <p class="center"><span class="muted">開始まで</span> <span class="timer" id="timer" style="font-size:2rem">${sec}</span></p>
  </div>`;
}
// 回っている途中に見せる名前（止まる直前はゆっくりになる）
function spinningName(i, el){
  const k = SLOT_KEYS[i];
  const names = ((state.decided.ballot.find((b) => b.key === k) || {}).options || []).map((o) => o.name);
  if(!names.length) return '';
  const left = SLOT_STOPS[i] - el;
  const step = left < 500 ? 220 : left < 1000 ? 140 : 70;
  return names[Math.floor(el / step + i * 3) % names.length];
}
const firstSpinning = (el) => SLOT_STOPS.findIndex((t) => el < t);
// スロットを回す（render で画面が描き直されても、経過時間から同じ見た目に戻る）
function spinSlots(){
  slotRAF = 0;
  if(!state || state.phase !== 'decided' || !state.config) return;
  const c = state.config, d = state.decided;
  const el = decidedElapsed();
  const lists = SLOT_KEYS.map((k) => ((d.ballot.find((b) => b.key === k) || {}).options || []).map((o) => o.name));
  const results = [c.formatName, c.modeName, c.answerName, c.genreName, c.difficultyName];
  const counts = [['format', c.format], ['mode', c.mode], ['answer', c.answer], ['genre', c.genre], ['difficulty', c.difficulty]].map(([k, id]) => (d.tally[k] || {})[id] || 0);
  lists.forEach((names, i) => {
    const reel = document.getElementById('reel-' + i), box = document.getElementById('slot-' + i), v = document.getElementById('votes-' + i);
    if(!reel || !box) return;
    if(el >= SLOT_STOPS[i] || names.length < 2){
      if(!box.classList.contains('stopped')){ box.classList.add('stopped'); if(el - SLOT_STOPS[i] < 600) sfx.stop(); reel.textContent = results[i]; if(v) v.textContent = counts[i] + '票'; }
      return;
    }
    const nm = spinningName(i, el);
    if(reel.textContent !== nm){ reel.textContent = nm; if(i === firstSpinning(el)) sfx.slot(); }
  });
  const t = document.getElementById('dec-title');
  if(t && el >= SLOT_STOPS[SLOT_STOPS.length - 1]) t.textContent = 'ルール決定！';
  const a = document.getElementById('dec-after'); if(a && el >= AFTER_SLOTS) a.hidden = false;
  const tm = document.getElementById('dec-teams'); if(tm && el >= TEAM_SHOW) tm.hidden = false;
  if(el < TEAM_SHOW + 100) slotRAF = requestAnimationFrame(spinSlots);
}

/* question */
function myStreakChip(){
  const mine = state.players.find((p) => p.id === me().id);
  return mine && mine.streak >= 2 && state.phase === 'question' ? ` <span class="streak">${mine.streak}連続中</span>` : '';
}
function qHead(){
  const q = state.question, sec = Math.ceil(remainingMs() / 1000);
  return `<div class="qhead"><span class="row" style="gap:8px"><span class="qno">Q${q.index + 1} / ${q.total}</span>${tagsHTML()}${myStreakChip()}</span>
    <span class="timer${state.phase === 'question' && sec <= 5 ? ' low' : ''}" id="timer">${state.phase === 'question' ? sec : ''}</span></div>`;
}
function answersHTML(opts){
  const q = state.question, o = opts || {};
  const tag = o.buttons ? 'button' : 'div';
  return '<div class="answers">' + q.choices.map((txt, i) => {
    const cls = ['ans', 'c' + i];
    if(o.correct != null){ cls.push(i === o.correct ? 'right' : 'dim'); }
    if(o.picked === i) cls.push('picked');
    const attrs = o.buttons ? ` type="button" data-act="answer" data-v="${i}"${o.disabled ? ' disabled' : ''}` : '';
    return `<${tag} class="${cls.join(' ')}"${attrs}><span class="L">${L[i]}</span><span class="t">${esc(txt)}</span></${tag}>`;
  }).join('') + '</div>';
}
function myPicked(){ return state.myAnswer != null ? state.myAnswer : pendingAnswer; }
function questionLocked(){
  const b = state.buzz;
  return myPicked() != null || remainingMs() <= 0 || !!(b && b.winnerName);
}
function questionStatus(){
  const q = state.question, b = state.buzz;
  const picked = myPicked(), out = remainingMs() <= 0;
  const mineText = state.myText != null ? state.myText : pendingText;
  let status = '';
  if(isBuzz()){
    if(b && b.winnerName) status = `<p class="banner">${esc(b.winnerName)} が正解！</p>`;
    else if(b && b.myMissed) status = `<p class="center" style="color:var(--bad)"><b>お手つき！</b> この問題には回答できません。</p>`;
    else if(picked != null) status = `<p class="center">判定中…</p>`;
    else if(out) status = `<p class="center" style="color:var(--bad)"><b>時間切れ</b></p>`;
    if(b && b.missed.length) status += `<div class="buzzline"><span class="muted">お手つき：</span>${b.missed.map((n) => `<span class="miss">${esc(n)}</span>`).join('')}</div>`;
  } else if(picked != null){
    status = q.typing
      ? `<p class="center">「<b>${esc(mineText)}</b>」で回答しました。答え合わせを待っています…</p>`
      : `<p class="center"><b>${L[picked]}</b> で回答しました。答え合わせを待っています…</p>`;
  } else if(out){
    status = `<p class="center" style="color:var(--bad)"><b>時間切れ</b></p>`;
  }
  return status;
}
function questionMeter(){
  const b = state.buzz;
  return `<span class="muted">${isBuzz() ? 'お手つき' : '回答'} <span class="count">${isBuzz() ? (b ? b.missed.length : 0) : state.answeredCount} / ${state.playerCount}</span></span>
      ${isHost() ? '<button class="btn small ghost" data-act="close">締め切る</button>' : ''}`;
}
function typingHTML(locked){
  return `<form class="typing" id="typing-form" autocomplete="off">
      <input type="text" id="typing-input" maxlength="40" placeholder="答えを入力" value="${esc(typingDraft)}" ${locked ? 'disabled' : ''} autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="答え">
      <button class="btn hi" type="submit" ${locked ? 'disabled' : ''}>送信</button>
    </form>
    <p class="muted center" style="font-size:.85rem">ひらがな・カタカナ・漢字のどれで入力しても正解になります。</p>`;
}
function questionHTML(){
  const q = state.question;
  const locked = questionLocked();
  const lastStretch = state.hidden && q.index === state.hideFrom
    ? `<p class="stretch">ここから終盤です。順位と合計点は結果発表まで非表示になります</p>` : '';
  return `<div class="stack">
    ${lastStretch}
    ${qHead()}

    <div class="qtext">${esc(q.text)}</div>
    ${isSpectator() ? `${q.typing ? '' : answersHTML({})}<p class="hint center">観戦中</p>` : (q.typing ? typingHTML(locked) : answersHTML({buttons:true, picked: myPicked(), disabled: locked}))}
    <div id="q-status">${questionStatus()}</div>
    <div class="meter" id="q-meter">${questionMeter()}</div>
  </div>`;

/* reveal */
const isSpectator = () => !!(state && state.me && state.me.spectator);
function ranking(){
  return state.players.filter((p) => !p.spectator).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}
function hiddenNote(){
  return `<div class="secret"><b>？？？</b><span>終盤のため、順位と合計点は非表示です。<br>結果発表でお知らせします。</span></div>`;
}
function rankHTML(limit){
  if(state.hidden) return hiddenNote();
  const r = ranking();
  const row = (x) => {
    const pos = rankNumber(x);
    const dlt = state.phase === 'reveal' ? (rankDelta[x.id] || 0) : 0;
    const arrow = dlt > 0 ? `<span class="mv up">↑${dlt}</span>` : dlt < 0 ? `<span class="mv down">↓${-dlt}</span>` : '';
    const fire = state.phase === 'reveal' && x.streak >= 3 ? `<span class="fire">${x.streak}連続</span>` : '';
    return `<li class="${x.id === me().id ? 'me' : ''}${dlt > 0 ? ' rise' : ''}"><span class="pos">${pos}</span><span class="nm">${av(x)}${teamDot(x)}${esc(x.name)}${npcTag(x)}${fire}${arrow}</span><span class="gain">${x.gain && state.phase !== 'final' ? '+' + x.gain : ''}</span><span class="sc">${x.score}</span></li>`;
  };
  const top = limit ? r.slice(0, limit) : r;
  const meRow = limit && !top.some((x) => x.id === me().id) ? r.find((x) => x.id === me().id) : null;
  return '<ol class="rank">' + top.map(row).join('') + (meRow ? '<li class="gap" aria-hidden="true">…</li>' + row(meRow) : '') + '</ol>';
}
function myPos(){
  const r = ranking(); const mine = r.find((x) => x.id === me().id);
  return mine ? r.filter((x) => x.score > mine.score).length + 1 : 0;
}
function revealAnswersHTML(rv, picked){
  const q = state.question;
  const max = Math.max(1, ...rv.dist);
  return `<ol class="alist">${q.choices.map((txt, i) => {
    const n = rv.dist[i] || 0;
    return `<li class="arow c${i}${i === rv.correct ? ' right' : ''}${picked === i ? ' mine' : ''}">
      <span class="L">${L[i]}</span><span class="t">${esc(txt)}</span>
      ${picked === i ? '<span class="you">あなた</span>' : ''}
      <span class="abar"><i style="width:${Math.round(100 * n / max)}%"></i></span><span class="n">${n}人</span>
    </li>`;
  }).join('')}</ol>`;
}
function teamStripHTML(){
  if(!isTeam()) return '';
  return `<div class="tstrip">${state.teams.map((t) => `<div class="${t.id}${me().team === t.id ? ' mine' : ''}">
    <span class="tn">${esc(t.name)}${me().team === t.id ? '（あなた）' : ''}</span>
    <b>${t.score == null ? '？？？' : t.score}</b>${t.gain ? `<small>+${t.gain}</small>` : ''}</div>`).join('')}</div>`;
}
function revealHTML(){
  updateRankDelta();
  const q = state.question, rv = state.reveal, picked = state.myAnswer;
  const mine = state.players.find((p) => p.id === me().id) || {score:0};
  const last = q.index + 1 >= q.total;
  const answerBlock = q.typing
    ? `<div class="truth"><small>正解</small><b>${esc(rv.correctText)}</b></div>
       <ul class="typed">${rv.typed.length ? rv.typed.map((t) => {
         const pl = state.players.find((p) => p.id === t.id) || {};
         return `<li class="${t.correct ? 'ok' : 'ng'}${t.id === me().id ? ' me' : ''}"><span class="mk">${t.correct ? '○' : '×'}</span><span class="nm">${av(pl)}${esc(t.name)}</span><span class="tx">${esc(t.text)}</span><span class="sec">${t.sec}秒</span></li>`;
       }).join('') : '<li class="empty muted">回答者はいませんでした</li>'}</ul>`
    : revealAnswersHTML(rv, picked);
  let verdict, cls;
  if(isSpectator()){ verdict = '答え合わせ'; cls = 'none'; }
  else if(isBuzz()){
    const w = rv.winner;
    if(w && w.id === me().id){ verdict = '早押し正解！'; cls = 'ok'; }
    else if(picked != null && !rv.myCorrect){ verdict = 'お手つき'; cls = 'ng'; }
    else if(w){ verdict = `${esc(w.name)} が先に正解`; cls = 'ng'; }
    else { verdict = '正解者なし'; cls = 'ng'; }
  } else {
    verdict = picked == null ? '回答なし' : rv.myCorrect ? '正解！' : '不正解';
    cls = picked == null ? 'none' : rv.myCorrect ? 'ok' : 'ng';
  }
  const sub = isBuzz() && rv.winner && rv.winner.id !== me().id ? `<p class="hint">${teamDot(rv.winner)}${esc(rv.winner.name)}（${rv.winner.sec}秒）</p>` : '';
  return `<div class="stack">
    ${qHead()}
    <div class="result ${cls}">
      <div class="verdict ${cls}" style="${verdict.length > 8 ? 'font-size:clamp(1.5rem,7vw,2.4rem)' : ''}">${verdict}</div>
      ${rv.myGain ? `<div class="pts" id="gainpts" data-to="${rv.myGain}" data-key="${esc(state.code)}:${q.index}">+${rv.myGain}</div>` : ''}
      ${rv.myCorrect && rv.myStreak >= 2 ? `<div class="combo"><span>${rv.myStreak}連続正解！</span><b>ボーナス +${rv.myBonus}</b></div>` : ''}
      ${sub}
      ${isSpectator() ? '' : `<p class="hint">${state.hidden ? '合計点と順位は結果発表まで非表示' : `合計 ${mine.score}点 ・ いま ${myPos()}位`}</p>`}
    </div>
    <p class="qtext small">${esc(q.text)}</p>
    ${answerBlock}
    ${teamStripHTML()}
    <section class="stack" style="gap:8px"><h3>順位</h3>${rankHTML(5)}</section>
    ${reactsHTML()}
    ${actionbar(`<div class="nextinfo"><span class="lbl">${last ? '結果発表' : '次の問題'}まで <span class="count" id="nexttimer">${Math.ceil(remainingMs() / 1000)}</span>秒</span><div class="nextbar"><i id="nextbar"></i></div></div>
      ${isHost() ? `<button class="btn small ghost" data-act="next">すぐ${last ? '結果へ' : '次へ'}</button>` : ''}`)}
  </div>`;
}

/* final */
// 結果発表の演出（ミリ秒）。全員の画面でそろうよう、サーバーからの経過時間で動かす
const FIN_SOLO = { p3: 1600, p2: 3600, drum: 5600, p1: 8000, rest: 9400 };
const FIN_TEAM = { rise: 1200, riseEnd: 5600, hold: 7400, win: 9400, rest: 10800 };
let finalStart = 0, finalRAF = 0;
function finalElapsed(){ return reducedMotion ? 999999 : Date.now() - finalStart; }
function finalButtonsHTML(){
  return isHost()
    ? `<details class="card more"><summary>問題数・制限時間・NPCを変更</summary><div class="stack" style="margin-top:12px">${settingsHTML()}${npcHTML()}</div></details>
       ${actionbar(`<button class="btn ghost" data-act="lobby">ロビーへ</button><button class="btn hi grow" data-act="startVote">もう一度プレイ</button>`)}`
    : actionbar(`<p class="waiting">ルーム主が次のゲームを開始するまでお待ちください</p>`);
}
function rankNumber(x){ return ranking().filter((y) => y.score > x.score).length + 1; }
function finalHTML(){
  if(!finalStart) finalStart = Date.now() - (state.finalElapsedMs || 0);
  return isTeam() ? teamFinalHTML() : soloFinalHTML();
}
function soloFinalHTML(){
  const r = ranking(), el = finalElapsed(), T = FIN_SOLO;
  const pod = (x, cls, at) => {
    if(!x) return `<div class="pod ${cls}"></div>`;
    const shown = el >= at;
    return `<div class="pod ${cls}${shown ? ' shown' : ''}" data-at="${at}" data-name="${esc(x.name)}" data-score="${x.score}点" data-av="${esc(AVATARS[x.avatar || 0])}" data-col="${x.color || 0}">
      ${shown ? av(x, true) : '<span class="av big blank" aria-hidden="true">？</span>'}<span class="nm">${shown ? esc(x.name) : '？？？'}</span><span class="sc">${shown ? x.score + '点' : '&nbsp;'}</span>
      <div class="blk">${rankNumber(x)}</div></div>`;
  };
  return `<div class="stack final">
    <div class="marquee"><h1>結果発表</h1></div>
    <div class="podium">${pod(r[1], 'p2', T.p2)}${pod(r[0], 'p1', T.p1)}${pod(r[2], 'p3', T.p3)}</div>
    <p class="drum" data-from="${T.drum}" data-until="${T.p1}" ${el >= T.drum && el < T.p1 ? '' : 'hidden'}>1位は……</p>
    <div class="stack reveal-in" data-at="${T.rest}" ${el >= T.rest ? '' : 'hidden'}>
      ${isSpectator() ? '' : `<p class="pts center">あなたは ${myPos()}位</p>`}
      ${reactsHTML()}
      ${rankHTML()}
      ${finalButtonsHTML()}
    </div>
  </div>`;
}
function teamFinalHTML(){
  const el = finalElapsed(), T = FIN_TEAM;
  const [a, b] = state.teams;
  const done = el >= T.win;
  const winner = a.score === b.score ? null : (a.score > b.score ? a : b);
  const head = winner ? `${esc(winner.name)}の勝利！` : '引き分け！';
  const mine = me().team && winner ? (me().team === winner.id ? 'あなたのチームの勝利です' : 'あなたのチームの負けです') : '';
  const bars = state.teams.map((t) => `<div class="tcol ${t.id}${done && winner && winner.id === t.id ? ' win' : ''}">
      <span class="num" id="tnum-${t.id}">0</span>
      <div class="track"><div class="fill" id="tfill-${t.id}"></div></div>
      <span class="tname">${esc(t.name)}${me().team === t.id ? '<small>（あなた）</small>' : ''}</span>
    </div>`).join('');
  return `<div class="stack final">
    <div class="marquee"><h1>結果発表</h1></div>
    <div class="tbars${done && winner ? ' decided' : ''}" id="tbars">${bars}</div>
    <p class="banner tmsg" id="tmsg">${done ? head : el >= T.riseEnd ? '勝つのは…' : '集計中…'}</p>
    <p class="center muted" id="tmine" ${done && mine ? '' : 'hidden'}>${mine}</p>
    <div class="stack reveal-in" data-at="${T.rest}" ${el >= T.rest ? '' : 'hidden'}>
      <h3>個人の成績</h3>
      ${isSpectator() ? '' : `<p class="pts center">あなたは ${myPos()}位</p>`}
      ${reactsHTML()}
      ${rankHTML()}
      ${finalButtonsHTML()}
    </div>
  </div>`;
}
// チーム戦の棒グラフの高さ（0〜1）と表示する点数
function teamBarValue(t, el){
  const T = FIN_TEAM;
  const scores = state.teams.map((x) => x.score);
  const max = Math.max(1, ...scores), low = Math.min(...scores);
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  let v;
  if(el < T.rise) v = 0;
  else if(el < T.riseEnd){
    // 両チームいっしょに伸びる。少しずつ抜きつ抜かれつ
    const k = (el - T.rise) / (T.riseEnd - T.rise);
    const sway = Math.sin(k * Math.PI * 5 + (t.id === 'red' ? 0 : Math.PI)) * max * 0.04 * (1 - k);
    v = Math.max(0, low * ease(k) + sway);
  }
  else if(el < T.hold) v = low;                      // 同じ高さで止まる
  else if(el < T.win) v = low + (t.score - low) * ease((el - T.hold) / (T.win - T.hold));
  else v = t.score;
  return { h: v / max, n: Math.round(v) };
}
let finalFx = {};
function finalSound(name, at, el){
  // それぞれの合図を1回だけ鳴らす（あとから開いた人には鳴らさない）
  if(el >= at && el < at + 1500 && !finalFx[name]){ finalFx[name] = true; sfx[name === 'p3' || name === 'p2' ? 'stop' : name](); }
  if(el >= at) finalFx[name] = true;
}
function animateFinal(){
  finalRAF = 0;
  if(!state || state.phase !== 'final') return;
  const el = finalElapsed();
  if(isTeam()){ finalSound('drum', FIN_TEAM.riseEnd, el); finalSound('fanfare', FIN_TEAM.win, el); }
  else { finalSound('p3', FIN_SOLO.p3, el); finalSound('p2', FIN_SOLO.p2, el); finalSound('drum', FIN_SOLO.drum, el); finalSound('fanfare', FIN_SOLO.p1, el); }
  document.querySelectorAll('.final [data-at]').forEach((n) => {
    const on = el >= +n.dataset.at;
    if(n.classList.contains('pod')){
      if(on && !n.classList.contains('shown')){
        n.classList.add('shown');
        n.querySelector('.nm').textContent = n.dataset.name;
        const a = n.querySelector('.av'); if(a){ a.className = 'av big c' + n.dataset.col; a.textContent = n.dataset.av; }
        n.querySelector('.sc').textContent = n.dataset.score;
      }
    } else if(n.hidden === on) n.hidden = !on;
  });
  const drum = document.querySelector('.final .drum');
  if(drum) drum.hidden = !(el >= +drum.dataset.from && el < +drum.dataset.until);
  if(isTeam()){
    const T = FIN_TEAM;
    for(const t of state.teams){
      const { h, n } = teamBarValue(t, el);
      const f = document.getElementById('tfill-' + t.id), num = document.getElementById('tnum-' + t.id);
      if(f) f.style.height = (h * 100) + '%';
      if(num) num.textContent = n;
    }
    const msg = document.getElementById('tmsg');
    const bars = document.getElementById('tbars');
    if(msg){
      const [a, b] = state.teams;
      const winner = a.score === b.score ? null : (a.score > b.score ? a : b);
      const text = el >= T.win ? (winner ? `${winner.name}の勝利！` : '引き分け！') : el >= T.riseEnd ? '勝つのは…' : '集計中…';
      if(msg.textContent !== text){ msg.textContent = text; msg.classList.toggle('shake', el >= T.riseEnd && el < T.win); }
      const mine = document.getElementById('tmine'); if(mine && el >= T.win && mine.textContent) mine.hidden = false;
      if(bars && el >= T.win && winner && !bars.classList.contains('decided')){
        bars.classList.add('decided');
        const w = bars.querySelector('.tcol.' + winner.id); if(w) w.classList.add('win');
      }
      if(bars) bars.classList.toggle('hold', el >= T.riseEnd && el < T.win);
    }
  }
  if(el >= (isTeam() ? FIN_TEAM.win : FIN_SOLO.p1) && !finalFx.confetti && (finalFx.confetti = true) && el < (isTeam() ? FIN_TEAM.win : FIN_SOLO.p1) + 4000) confetti();
  const end = isTeam() ? FIN_TEAM.rest : FIN_SOLO.rest;
  if(el < end + 200) finalRAF = requestAnimationFrame(animateFinal);
}
function confetti(count){
  if(reducedMotion) return;
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  const colors = ['var(--a1)', 'var(--a2)', 'var(--a3)', 'var(--a4)', 'var(--hi)'];
  for(let i = 0; i < (count || 60); i++){
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.8) + 's';
    p.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), count ? 3500 : 5000);
}

/* ---------- ticking ---------- */
let lastTick = Date.now();
let tickSec = null;
setInterval(() => {
  const now = Date.now(), dt = now - lastTick; lastTick = now;
  renderNetbar();
  // 通信が切れているあいだは、タイマーや演出を止めておく
  if(session && !online){
    deadline += dt;
    if(decidedStart) decidedStart += dt;
    if(finalStart) finalStart += dt;
    return;
  }
  if(!state) return;
  const t = timerSource(); if(!t) return;
  const ms = remainingMs(), sec = Math.ceil(ms / 1000);
  const el = $('#timer'), bar = $('#tbar'), nx = $('#nexttimer'), nb = $('#nextbar');
  if(nx) nx.textContent = sec;
  if(nb) nb.style.width = Math.min(100, 100 * ms / 5000) + '%';
  if(el && state.phase !== 'reveal'){ el.textContent = sec; if(state.phase !== 'decided') el.classList.toggle('low', sec <= 5); }
  if(bar && state.phase !== 'reveal'){
    const total = state.question ? state.question.time * 1000 : 1;
    bar.style.width = (100 * ms / total) + '%';
  }
  if(state.phase === 'question' && sec <= 3 && sec >= 1 && state.myAnswer == null && pendingAnswer == null && tickSec !== state.question.index + ':' + sec){
    tickSec = state.question.index + ':' + sec; sfx.tick();
    if(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  }
  if(state.phase === 'question' && ms <= 0 && state.myAnswer == null && pendingAnswer == null && !$('#stage').dataset.out){ $('#stage').dataset.out = '1'; render(); }
  if(ms > 0) $('#stage').dataset.out = '';
}, 200);

/* ---------- actions ---------- */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch(act){
    case 'botLevel': botLevel = v; store('quiz.botLevel', v); render(); break;
    case 'addBot': { const r = await api('addBot', {level: botLevel}); if(!r.ok && r.error) toast(r.error); break; }
    case 'removeBot': api('removeBot', {id: v}); break;
    case 'setting': api('settings', {[b.dataset.k]: +v}); break;
    case 'startVote': { const r = await api('startVote'); if(!r.ok && r.error) toast(r.error); break; }
    case 'vote': {
      // 押したらすぐ見た目に反映し、サーバーにも送る
      if(state.vote){ state.vote.mine = Object.assign({}, state.vote.mine, {[b.dataset.k]: v}); render(); }
      const r = await api('vote', {key: b.dataset.k, value: v});
      if(!r.ok && r.error) toast(r.error);
      break;
    }
    case 'closeVote': api('closeVote'); break;
    case 'ready': {
      const on = v === '1';
      if(state.vote){ state.vote.myReady = on; render(); }
      const r = await api('ready', {on});
      if(!r.ok){ if(state.vote) state.vote.myReady = !on; render(); if(r.error) toast(r.error); }
      break;
    }
    case 'mute': sfx.toggle(); renderHeader(); break;
    case 'togglePicker': { const nm = $('#name'); const keep = nm ? nm.value : null; pickerOpen = !pickerOpen; render(); if(keep != null && $('#name')) $('#name').value = keep; break; }
    case 'pickAv': case 'pickCol': {
      if(act === 'pickAv'){ myAvatar = +v; store('quiz.avatar', v); } else { myColor = +v; store('quiz.color', v); }
      if(session && state) api('profile', {avatar: myAvatar, color: myColor});
      // トップ画面では入力中の名前を消さないように
      const nm = $('#name'); const keep = nm ? nm.value : null;
      render(); if(keep != null && $('#name')) $('#name').value = keep;
      break;
    }
    case 'spectate': { const r = await api('spectate', {on: v === '1'}); if(!r.ok && r.error) toast(r.error); break; }
    case 'share': {
      try{ await navigator.share({title: 'みんなのクイズ大会', text: `クイズ大会に参加しよう（ルーム番号 ${state.code}）`, url: joinUrl()}); }catch(e){}
      break;
    }
    case 'chatOpen': chatOpen = true; markChatSeen(); $('#chatpeek').hidden = true; $('#chatlist').dataset.sig = ''; renderChat(); setTimeout(() => { const i = $('#chatinput'); if(i && !i.disabled) i.focus(); }, 50); break;
    case 'chatClose': chatOpen = false; markChatSeen(); renderChat(); break;
    case 'react': {
      if(Date.now() - lastReactAt < 700) return;
      lastReactAt = Date.now();
      b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
      api('react', {k: +v});
      break;
    }
    case 'answer': {
      if(!online){ toast('再接続中です。少し待ってから回答してください。'); return; }
      if(state.myAnswer != null || pendingAnswer != null || remainingMs() <= 0) return;
      pendingAnswer = +v; sfx.tap(); vibrate(15); render();
      const r = await api('answer', {c: +v});
      if(!r.ok){ pendingAnswer = null; toast(r.error || '回答を送れませんでした。'); render(); }
      break;
    }
    case 'close': api('close'); break;
    case 'next': api('next'); break;
    case 'lobby': api('lobby'); break;
    case 'copy': {
      const url = joinUrl();
      try{ await navigator.clipboard.writeText(url); toast('参加リンクをコピーしました'); }
      catch(err){ toast('このリンクを送ってください：' + url); }
      break;
    }
    case 'leave': {
      // 1回目は確認。3秒以内にもう一度押すと退出
      if(Date.now() >= leaveConfirmUntil){ leaveConfirmUntil = Date.now() + 3000; renderHeader(); setTimeout(renderHeader, 3050); return; }
      leaveConfirmUntil = 0;
      await api('leave'); if(es) es.close(); es = null; leaveLocal('');
      break;
    }
  }
});

/* ---------- typing ---------- */
document.addEventListener('input', (e) => { if(e.target.id === 'typing-input') typingDraft = e.target.value; });
document.addEventListener('compositionstart', (e) => { if(e.target.id === 'typing-input') composing = true; });
document.addEventListener('compositionend', (e) => { if(e.target.id === 'typing-input') composing = false; });
document.addEventListener('submit', async (e) => {
  if(e.target.id !== 'typing-form') return;
  e.preventDefault();
  if(composing) return;
  const input = document.getElementById('typing-input');
  const text = (input ? input.value : typingDraft).trim();
  if(!text){ toast('答えを入力してください。'); return; }
  if(!state || state.phase !== 'question' || questionLocked()) return;
  if(!online){ toast('再接続中です。少し待ってから送信してください。'); return; }
  pendingAnswer = -1; pendingText = text; sfx.send(); vibrate(15); render();
  const r = await api('answer', {text});
  if(!r.ok){ pendingAnswer = null; pendingText = null; toast(r.error || '回答を送れませんでした。'); render(); }
});

/* ---------- boot ---------- */
loadUpdates();
(async function boot(){
  try{
    const d = JSON.parse(sessionStorage.getItem('quiz.draft') || 'null');
    if(d){ lastKey = d.key; typingDraft = d.text || ''; sessionStorage.removeItem('quiz.draft'); }
  }catch(e){}
  const urlCode = new URLSearchParams(location.search).get('room');
  if(session && (!urlCode || urlCode === session.code)){
    loadSnap();
    let r = await api('join');
    if(!r.ok && !r.net && lastSnap) r = await api('restore', {snap: lastSnap});
    if(r.ok){ connect(); render(); return; }
    if(r.net){ render(); setOnline(false); resume(); return; }
    saveSession(null);
  }
  render();
})();
})();
