<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなのクイズ大会</title>
<meta name="description" content="ルームコードを入れるだけ。みんなでスマホから4択クイズの早押し大会。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one centered stage column, like a game-show screen; answer tiles are the only loud color. */
:root{
  --bg:#FFF4CC; --surface:#FFFDF4; --ink:#1E1B2E; --muted:#6C6680; --line:#EADBA4;
  --hi:#FFC21A; --on-hi:#1E1B2E; --hi-shadow:#C48C00;
  --good:#16935F; --bad:#D23A3F;
  --a1:#E0464B; --a2:#2D72E8; --a3:#F2A21B; --a4:#1E9B67; --on-a:#FFFFFF; --on-a3:#2A1C00;
  --silver:#C9C4D6; --bronze:#E3A86B;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --dot:"DotGothic16","Hiragino Sans",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15131D; --surface:#211E2D; --ink:#FFF4CC; --muted:#A39CB8; --line:#363149; --good:#3CCB8B; --bad:#FF6B6F; --silver:#8E88A3; --bronze:#B9804A; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.15rem}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--hi);color:var(--on-hi);font-size:1.2rem;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--hi)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:.8rem;color:var(--muted);background:var(--surface);max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.off .dot{background:var(--bad)}
.pill.host{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}

.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:700;background:var(--ink);color:var(--bg);font-size:1rem;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.hi{background:var(--hi);color:var(--on-hi);box-shadow:0 4px 0 var(--hi-shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:7px 14px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.center{text-align:center}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.88rem}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-weight:700;min-height:1.6em}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 0 8px}
.hero h1{font-size:clamp(2rem,8vw,3.2rem)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.home-grid{grid-template-columns:1fr}}
.home-grid .panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.lbl{font-size:.82rem;color:var(--muted);letter-spacing:.06em;font-weight:700}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.1rem}
input.code{font-family:var(--dot);font-size:1.8rem;letter-spacing:.3em;text-align:center}

/* lobby */
.marquee{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:12px 0}
.marquee h1{font-size:clamp(1.6rem,6vw,2.6rem)}
.code-card{display:flex;flex-direction:column;align-items:center;gap:4px}
.big-code{font-family:var(--dot);font-size:clamp(3.4rem,16vw,6rem);line-height:1;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.share{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:100%}
.share code{font-size:.85rem;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:pop .25s ease-out}
.chip.me{border-color:var(--hi);background:var(--hi);color:var(--on-hi)}
.chip.off{opacity:.45}
.chip .crown{font-size:.75rem;margin-left:4px}
.chip.bot{border-style:dashed;display:inline-flex;align-items:center;gap:6px}
.npc{display:inline-block;font-family:var(--dot);font-size:.72rem;font-weight:400;padding:0 6px;border-radius:6px;background:var(--line);color:var(--ink);letter-spacing:.04em;vertical-align:middle}
.chip .x{border:0;background:none;padding:0 2px;font-size:1rem;line-height:1;color:var(--muted)}
.npc-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}

.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.genre{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.genre b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.genre small{color:var(--muted);font-size:.8rem}
.genre[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--on-hi)}
.genre[aria-pressed="true"] small{color:var(--on-hi);opacity:.75}
.genre:disabled{cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-family:var(--dot);font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{cursor:default}
.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.setting-row{grid-template-columns:1fr}}
.setting-row>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:.8rem;font-weight:700}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qno{font-family:var(--dot);font-size:1.1rem;letter-spacing:.06em}
.timer{font-family:var(--dot);font-size:2.6rem;line-height:1;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi);transition:width .25s linear}
.qtext{font-family:var(--display);font-size:clamp(1.35rem,4.6vw,2.1rem);line-height:1.45;text-wrap:balance;padding:8px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{position:relative;display:flex;align-items:center;gap:12px;min-height:96px;border:0;border-radius:18px;padding:14px 16px;text-align:left;font-weight:700;font-size:1.08rem;color:var(--on-a);box-shadow:0 5px 0 rgba(0,0,0,.22);min-width:0}
.ans .t{min-width:0;overflow-wrap:anywhere}
.ans .L{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.25);font-family:var(--dot);font-size:1.3rem}
.ans.c0{background:var(--a1)} .ans.c1{background:var(--a2)} .ans.c2{background:var(--a3);color:var(--on-a3)} .ans.c3{background:var(--a4)}
.ans.c2 .L{background:rgba(0,0,0,.12)}
button.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
button.ans:disabled{cursor:default}
.ans.dim{opacity:.28}
.ans.picked{outline:4px solid var(--ink);outline-offset:3px}
.ans.right::after{content:"正解";position:absolute;top:-10px;right:12px;background:var(--ink);color:var(--bg);font-size:.75rem;padding:2px 10px;border-radius:99px}
.meter{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-family:var(--dot);font-size:1.3rem}

/* reveal */
.verdict{font-family:var(--display);font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.1}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.pts{font-family:var(--dot);font-size:1.8rem}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:130px}
.dcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.dcol b{font-family:var(--dot);font-size:1.1rem;font-weight:400}
.dcol i{display:block;width:100%;border-radius:10px 10px 4px 4px;min-height:6px;transition:height .5s ease-out}
.dcol.c0 i{background:var(--a1)} .dcol.c1 i{background:var(--a2)} .dcol.c2 i{background:var(--a3)} .dcol.c3 i{background:var(--a4)}
.dcol.no i{opacity:.3}
.dcol small{font-family:var(--dot);font-size:1rem}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.rank li.me{border-color:var(--hi);box-shadow:inset 4px 0 0 var(--hi)}
.rank .pos{font-family:var(--dot);font-size:1.1rem;text-align:center}
.rank .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .gain{font-family:var(--dot);color:var(--good);font-size:.95rem}
.rank .sc{font-family:var(--dot);font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right;min-width:4ch}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;color:var(--on-hi)}
.pod.p1 .blk{height:140px;background:var(--hi)}
.pod.p2 .blk{height:100px;background:var(--silver)}
.pod.p3 .blk{height:76px;background:var(--bronze)}
.pod .sc{font-family:var(--dot)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">Q</span><span>みんなのクイズ大会</span></div>
    <div class="who" id="who"></div>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = ['A','B','C','D'];
const COUNTS = [5, 10, 15], TIMES = [10, 15, 20, 30];
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }

let session = null;      // {code, token}
try{ session = JSON.parse(store('quiz.session') || 'null'); }catch(e){ session = null; }
let state = null;        // latest state from the server
let es = null;           // EventSource
let online = false;
let deadline = 0;        // local ms when the current question closes
let lastQKey = null;
let pendingAnswer = null;
let homeError = '';

/* ---------- server ---------- */
async function api(action, body){
  try{
    const r = await fetch('/api/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({}, session || {}, body || {}))});
    return await r.json();
  }catch(e){ return {ok:false, net:true, error:'サーバーにつながりません。通信状態を確かめてください。'}; }
}
let reconnecting = false;
function connect(){
  if(es) es.close();
  es = new EventSource('/events?code=' + encodeURIComponent(session.code) + '&token=' + encodeURIComponent(session.token));
  es.addEventListener('state', (ev) => {
    online = true;
    try{ state = JSON.parse(ev.data); }catch(e){ return; }
    onState();
  });
  es.onopen = () => { online = true; renderHeader(); };
  es.onerror = async () => {
    online = false; renderHeader();
    if(reconnecting) return;
    reconnecting = true;
    const r = await api('join');
    reconnecting = false;
    if(r.net){ if(es && es.readyState === EventSource.CLOSED) setTimeout(() => session && connect(), 3000); return; }
    if(!r.ok){
      // ルームが消えていたら（サーバーの再起動など）最初の画面へ戻る
      if(es) es.close(); es = null;
      leaveLocal('ルームが終了しました。もう一度ルームを作るか参加してください。');
      return;
    }
    if(es && es.readyState === EventSource.CLOSED) setTimeout(() => session && connect(), 1000);
  };
}
function saveSession(s){ session = s; store('quiz.session', s ? JSON.stringify(s) : null); }
function leaveLocal(msg){
  saveSession(null); state = null; homeError = msg || '';
  history.replaceState(null, '', location.pathname);
  render();
}

/* ---------- state ---------- */
function onState(){
  if(state.question){
    const key = state.phase + ':' + state.question.index + ':' + state.code;
    if(state.phase === 'question'){
      const fresh = Date.now() + state.question.remainingMs;
      if(key !== lastQKey || Math.abs(fresh - deadline) > 700) deadline = fresh;
    }
    if(key !== lastQKey && state.phase === 'question') pendingAnswer = null;
    lastQKey = key;
  }
  render();
}
const me = () => state && state.me;
const isHost = () => !!(state && state.me && state.me.isHost);
const remainingMs = () => Math.max(0, deadline - Date.now());

/* ---------- render ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3000); }

function renderHeader(){
  const who = $('#who');
  if(!session || !state){ who.innerHTML = ''; return; }
  const n = state.players.filter((p) => p.connected).length;
  who.innerHTML =
    `<span class="pill${online ? '' : ' off'}"><span class="dot"></span>${online ? '参加 ' + n + '人' : '再接続中…'}</span>` +
    `<span class="pill${isHost() ? ' host' : ''}">${isHost() ? '司会・' : ''}${esc(me().name)}</span>` +
    `<button class="link" data-act="leave">退出</button>`;
}

function render(){
  renderHeader();
  const stage = $('#stage');
  if(!session){ stage.innerHTML = homeHTML(); bindHome(); return; }
  if(!state){ stage.innerHTML = `<div class="marquee"><p class="muted">接続中…</p></div>`; return; }
  const ph = state.phase;
  if(ph === 'lobby') stage.innerHTML = lobbyHTML();
  else if(ph === 'question') stage.innerHTML = questionHTML();
  else if(ph === 'reveal') stage.innerHTML = revealHTML();
  else if(ph === 'final') stage.innerHTML = finalHTML();
}

function homeHTML(){
  const urlCode = new URLSearchParams(location.search).get('room') || '';
  const name = store('quiz.name') || '';
  return `<div class="hero">
      <h1>みんなで早押しクイズ</h1>
      <p class="muted">ログイン不要。ルームの番号を入れるだけで、スマホから参加できます。</p>
    </div>
    <div class="panel stack" style="max-width:520px;width:100%;margin:0 auto">
      <label class="lbl" for="name">ニックネーム</label>
      <input type="text" id="name" maxlength="12" placeholder="例：たろう" value="${esc(name)}" autocomplete="nickname">
    </div>
    <div class="home-grid">
      <form class="panel" id="join-form">
        <h2 style="font-size:1.2rem">ルームに参加する</h2>
        <label class="lbl" for="code">ルーム番号（4けた）</label>
        <input type="text" id="code" class="code" inputmode="numeric" maxlength="6" placeholder="0000" value="${esc(urlCode)}" autocomplete="off">
        <button class="btn hi" type="submit">参加する</button>
      </form>
      <form class="panel" id="create-form">
        <h2 style="font-size:1.2rem">ルームを作る</h2>
        <p class="muted">あなたがルーム主になります。ジャンルを選んでスタートでき、自分も一緒に回答できます。友達がいなくても、NPCと対戦できます。</p>
        <button class="btn" type="submit" style="margin-top:auto">新しいルームを作る</button>
      </form>
    </div>
    <p class="err center" id="home-err">${esc(homeError)}</p>`;
}
function bindHome(){
  const nameEl = $('#name'), codeEl = $('#code'), err = $('#home-err');
  const getName = () => {
    const v = nameEl.value.trim();
    if(!v){ err.textContent = 'ニックネームを入れてください。'; nameEl.focus(); return null; }
    store('quiz.name', v); return v;
  };
  $('#join-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = getName(); if(!name) return;
    const code = codeEl.value.replace(/\D/g, '');
    if(code.length < 4){ err.textContent = 'ルーム番号を4けたで入れてください。'; codeEl.focus(); return; }
    const r = await fetch('/api/join', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code, name})}).then((x) => x.json()).catch(() => ({ok:false, error:'サーバーにつながりません。'}));
    if(!r.ok){ err.textContent = r.error || '参加できませんでした。'; return; }
    homeError = ''; saveSession({code:r.code, token:r.token}); connect(); render();
  });
  $('#create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = getName(); if(!name) return;
    const r = await fetch('/api/create', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})}).then((x) => x.json()).catch(() => ({ok:false, error:'サーバーにつながりません。'}));
    if(!r.ok){ err.textContent = r.error || 'ルームを作れませんでした。'; return; }
    homeError = ''; saveSession({code:r.code, token:r.token}); connect(); render();
  });
  if(new URLSearchParams(location.search).get('room') && !nameEl.value) nameEl.focus();
}

const npcTag = (p) => p.bot ? ` <span class="npc">NPC・${esc(p.level)}</span>` : '';
function chipsHTML(){
  const canRemove = isHost() && (state.phase === 'lobby' || state.phase === 'final');
  return '<div class="chips">' + state.players.map((p) =>
    `<span class="chip${p.id === me().id ? ' me' : ''}${p.connected ? '' : ' off'}${p.bot ? ' bot' : ''}">${esc(p.name)}${p.isHost ? '<span class="crown">司会</span>' : ''}${npcTag(p)}` +
    (p.bot && canRemove ? `<button class="x" data-act="removeBot" data-v="${esc(p.id)}" aria-label="${esc(p.name)}を外す">×</button>` : '') + `</span>`
  ).join('') + '</div>';
}
let botLevel = store('quiz.botLevel') || 'normal';
function npcHTML(){
  const bots = state.players.filter((p) => p.bot).length;
  const levels = [['easy','よわい'],['normal','ふつう'],['hard','つよい']];
  return `<div class="stack" style="gap:8px">
    <span class="lbl">NPC（コンピューター）${bots ? ` ・ ${bots}人` : ''}</span>
    <div class="npc-row">
      <div class="seg">${levels.map(([v, l]) => `<button type="button" data-act="botLevel" data-v="${v}" aria-pressed="${botLevel === v}">${l}</button>`).join('')}</div>
      <button class="btn small" data-act="addBot" ${bots >= 7 ? 'disabled' : ''}>NPCを追加</button>
    </div>
    <p class="muted" style="font-size:.85rem">友達がいなくても、NPCを入れれば1人で大会ができます。名前の×で外せます。</p>
  </div>`;
}
function joinUrl(){ return location.origin + location.pathname + '?room=' + state.code; }

function lobbyHTML(){
  const s = state.settings, host = isHost();
  const g = state.genres.find((x) => x.id === s.genre) || {};
  const dis = host ? '' : 'disabled';
  const genreBtns = state.genres.map((x) =>
    `<button class="genre" type="button" data-act="genre" data-v="${esc(x.id)}" aria-pressed="${s.genre === x.id}" ${host && x.count ? '' : 'disabled'}><b>${esc(x.name)}</b><small>${esc(x.note)}・${x.count}問</small></button>`).join('');
  const seg = (list, cur, act, unit) => '<div class="seg">' + list.map((v) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur === v}" ${dis}>${v}${unit}</button>`).join('') + '</div>';
  return `<div class="marquee">
      <div class="code-card"><span class="lbl">ルーム番号</span><div class="big-code">${esc(state.code)}</div></div>
      <div class="share"><code>${esc(joinUrl())}</code><button class="btn small ghost" data-act="copy">リンクをコピー</button></div>
      ${chipsHTML()}
    </div>
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><h2 style="font-size:1.2rem">${host ? '出題の設定' : 'ルーム主が準備中です'}</h2>${host ? '' : '<span class="muted" style="font-size:.88rem">スタートまでお待ちください</span>'}</div>
      <div class="stack" style="gap:8px"><span class="lbl">ジャンル</span><div class="genres">${genreBtns}</div></div>
      <div class="setting-row">
        <div><span class="lbl">問題数</span>${seg(COUNTS, s.count, 'count', '問')}</div>
        <div><span class="lbl">制限時間（1問）</span>${seg(TIMES, s.time, 'time', '秒')}</div>
      </div>
      ${host ? npcHTML() : ''}
      ${host ? `<div class="row" style="justify-content:space-between">
        <span class="muted">${esc(g.name)}から${Math.min(s.count, g.count || 0)}問を出題</span>
        <button class="btn hi" data-act="start">スタート</button></div>` : ''}
    </div>`;
}

function qHead(){
  const q = state.question, sec = Math.ceil(remainingMs() / 1000);
  return `<div class="qhead"><span class="row" style="gap:8px"><span class="qno">Q${q.index + 1} / ${q.total}</span>${q.genre ? `<span class="tag">${esc(q.genre)}</span>` : ''}</span>
    <span class="timer${state.phase === 'question' && sec <= 5 ? ' low' : ''}" id="timer">${state.phase === 'question' ? sec : ''}</span></div>`;
}
function answersHTML(opts){
  const q = state.question, o = opts || {};
  const tag = o.buttons ? 'button' : 'div';
  return '<div class="answers">' + q.choices.map((txt, i) => {
    const cls = ['ans', 'c' + i];
    if(o.correct != null){ cls.push(i === o.correct ? 'right' : 'dim'); }
    if(o.picked === i) cls.push('picked');
    const attrs = o.buttons ? ` type="button" data-act="answer" data-v="${i}"${o.disabled ? ' disabled' : ''}` : '';
    return `<${tag} class="${cls.join(' ')}"${attrs}><span class="L">${L[i]}</span><span class="t">${esc(txt)}</span></${tag}>`;
  }).join('') + '</div>';
}
function questionHTML(){
  const q = state.question;
  const picked = state.myAnswer != null ? state.myAnswer : pendingAnswer;
  const out = remainingMs() <= 0;
  const status = picked != null
    ? `<p class="center"><b>${L[picked]}</b> で回答しました。答え合わせを待っています…</p>`
    : out ? `<p class="center" style="color:var(--bad)"><b>時間切れ</b></p>` : '';
  return `<div class="stack">
    ${qHead()}
    <div class="bar"><i id="tbar" style="width:${100 * remainingMs() / (q.time * 1000)}%"></i></div>
    <div class="qtext">${esc(q.text)}</div>
    ${answersHTML({buttons:true, picked, disabled: picked != null || out})}
    ${status}
    <div class="meter"><span class="muted">回答 <span class="count">${state.answeredCount} / ${state.playerCount}</span></span>
      ${isHost() ? '<button class="btn small ghost" data-act="close">締め切る</button>' : ''}</div>
  </div>`;
}
function ranking(){
  return state.players.slice().sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}
function rankHTML(limit){
  const r = ranking(); let pos = 0, prev = null;
  return '<ol class="rank">' + r.slice(0, limit || r.length).map((x, i) => {
    if(x.score !== prev){ pos = i + 1; prev = x.score; }
    return `<li class="${x.id === me().id ? 'me' : ''}"><span class="pos">${pos}</span><span class="nm">${esc(x.name)}${npcTag(x)}</span><span class="gain">${x.gain ? '+' + x.gain : ''}</span><span class="sc">${x.score}</span></li>`;
  }).join('') + '</ol>';
}
function myPos(){
  const r = ranking(); const mine = r.find((x) => x.id === me().id);
  return mine ? r.filter((x) => x.score > mine.score).length + 1 : 0;
}
function revealHTML(){
  const q = state.question, rv = state.reveal, picked = state.myAnswer;
  const mine = state.players.find((p) => p.id === me().id) || {score:0};
  const last = q.index + 1 >= q.total;
  const max = Math.max(1, ...rv.dist);
  return `<div class="stack">
    ${qHead()}
    <div class="marquee" style="padding:4px 0">
      <div class="verdict ${rv.myCorrect ? 'ok' : 'ng'}">${picked == null ? '回答なし' : rv.myCorrect ? '正解！' : '残念…'}</div>
      ${rv.myCorrect ? `<div class="pts">+${rv.myGain}</div>` : ''}
      <p class="muted">合計 ${mine.score}点 ・ いま ${myPos()}位</p>
    </div>
    <div class="qtext" style="font-size:1.25rem">${esc(q.text)}</div>
    ${answersHTML({correct: rv.correct, picked})}
    <div class="dist">${rv.dist.map((n, i) => `<div class="dcol c${i}${i === rv.correct ? '' : ' no'}"><b>${n}</b><i style="height:${Math.round(100 * n / max)}%"></i><small>${L[i]}</small></div>`).join('')}</div>
    <h3>順位</h3>
    ${rankHTML(8)}
    ${isHost()
      ? `<div class="row" style="justify-content:flex-end"><button class="btn hi" data-act="next">${last ? '結果発表へ' : '次の問題へ'}</button></div>`
      : `<p class="center muted">ルーム主が次へ進めるのを待っています…</p>`}
  </div>`;
}
function finalHTML(){
  const r = ranking();
  const pod = (x, cls, label) => x ? `<div class="pod ${cls}"><span class="nm">${esc(x.name)}</span><span class="sc">${x.score}点</span><div class="blk">${label}</div></div>` : `<div class="pod ${cls}"></div>`;
  return `<div class="stack">
    <div class="marquee"><h1>結果発表</h1><p class="pts">あなたは ${myPos()}位</p></div>
    <div class="podium">${pod(r[1], 'p2', '2')}${pod(r[0], 'p1', '1')}${pod(r[2], 'p3', '3')}</div>
    ${rankHTML()}
    ${isHost()
      ? `<div class="row" style="justify-content:center"><button class="btn ghost" data-act="lobby">設定を変える</button><button class="btn hi" data-act="start">同じ設定でもう一度</button></div>`
      : `<p class="center muted">ルーム主が次のゲームを始めるまでお待ちください。</p>`}
  </div>`;
}

/* ---------- ticking ---------- */
setInterval(() => {
  if(!state || state.phase !== 'question') return;
  const ms = remainingMs(), sec = Math.ceil(ms / 1000);
  const t = $('#timer'), b = $('#tbar');
  if(t){ t.textContent = sec; t.classList.toggle('low', sec <= 5); }
  if(b) b.style.width = (100 * ms / (state.question.time * 1000)) + '%';
  if(ms <= 0 && state.myAnswer == null && pendingAnswer == null && !$('#stage').dataset.out){ $('#stage').dataset.out = '1'; render(); }
  if(ms > 0) $('#stage').dataset.out = '';
}, 200);

/* ---------- actions ---------- */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch(act){
    case 'genre': api('settings', {genre: v}); break;
    case 'count': api('settings', {count: +v}); break;
    case 'time': api('settings', {time: +v}); break;
    case 'botLevel': botLevel = v; store('quiz.botLevel', v); render(); break;
    case 'addBot': { const r = await api('addBot', {level: botLevel}); if(!r.ok && r.error) toast(r.error); break; }
    case 'removeBot': api('removeBot', {id: v}); break;
    case 'start': { const r = await api('start'); if(!r.ok && r.error) toast(r.error); break; }
    case 'answer': {
      if(state.myAnswer != null || pendingAnswer != null || remainingMs() <= 0) return;
      pendingAnswer = +v; render();
      const r = await api('answer', {c: +v});
      if(!r.ok){ pendingAnswer = null; toast(r.error || '回答を送れませんでした。'); render(); }
      break;
    }
    case 'close': api('close'); break;
    case 'next': api('next'); break;
    case 'lobby': api('lobby'); break;
    case 'copy': {
      const url = joinUrl();
      try{ await navigator.clipboard.writeText(url); toast('参加リンクをコピーしました'); }
      catch(err){ const c = b.previousElementSibling; const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents(c); sel.removeAllRanges(); sel.addRange(rg); toast('リンクを選択しました。コピーしてください'); }
      break;
    }
    case 'leave': {
      if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = '本当に退出する'; setTimeout(() => { if(b.isConnected){ b.dataset.sure = ''; b.textContent = '退出'; } }, 3000); return; }
      await api('leave'); if(es) es.close(); es = null; leaveLocal('');
      break;
    }
  }
});

/* ---------- boot ---------- */
(async function boot(){
  const urlCode = new URLSearchParams(location.search).get('room');
  if(session && (!urlCode || urlCode === session.code)){
    const r = await api('join');
    if(r.ok){ connect(); render(); return; }
    saveSession(null);
  }
  render();
})();
})();
</script>
</body>
</html>
